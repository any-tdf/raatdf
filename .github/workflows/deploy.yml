# GitHub Actions workflow for deploying to GitHub Pages
# GitHub Actions 工作流：部署到 GitHub Pages
name: Deploy

# 触发条件：推送到 main 分支或手动触发
on:
  push:
    branches:
      - main
  workflow_dispatch:

# 权限设置
permissions:
  contents: read
  pages: write
  id-token: write

# 并发设置：避免多个部署同时运行
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # 构建作业
  build:
    name: Build project
    runs-on: ubuntu-latest
    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置 Vite Plus 与 Node.js 运行时
      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      # 安装项目依赖
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install documentation dependencies
        working-directory: doc
        run: bun install --frozen-lockfile

      # 检查格式、lint 与类型
      - name: Check project
        run: bun run check

      - name: Test project
        run: bun run test

      - name: Audit project dependencies
        run: bun audit

      - name: Check documentation
        working-directory: doc
        run: bun run check

      - name: Audit documentation dependencies
        working-directory: doc
        run: bun audit

      # 构建项目
      - name: Build project
        run: bun run build

      - name: Build documentation
        working-directory: doc
        run: bun run build

      # 上传构建产物
      - name: Upload build artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # 部署作业
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
